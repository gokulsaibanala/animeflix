<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GMARK</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="main">
      <nav>
        <img src="logo.svg" width="40" height="40" />
        <div class="flex">
          <button>Legends</button>
          <button>Sign in</button>
        </div>
      </nav>
      <div class="box"></div>
      <div class="hero">
        <span>Unlimited anime. Endless adventures.</span>
        <span>Every arc. Every battle. Every legend.</span>
        <span>Watch. Feel. Escape.</span>
        <div>
          <input type="text" placeholder="Your gateway email" />
          <button>SUMMON</button>
        </div>
      </div>
      <div class="separation"></div>
    </div>
    <section class="row">
      <h2>🔥 Top 10 Anime Today</h2>

      <div class="slider">
        <div class="card"><span>1</span><img src="11.jpg" /></div>
        <div class="card"><span>2</span><img src="2.jpg" /></div>
        <div class="card"><span>3</span><img src="3.jpg" /></div>
        <div class="card"><span>4</span><img src="4.png" /></div>
        <div class="card"><span>5</span><img src="5.jpg" /></div>
        <div class="card"><span>6</span><img src="6.jpg" /></div>
        <div class="card"><span>7</span><img src="7.png" /></div>
        <div class="card">
          <span>8</span
          ><img src="https://wallpapercave.com/wp/wp12247306.jpg" />
        </div>
        <div class="card">
          <span>9</span
          ><img src="https://wallpapercave.com/wp/wp10228869.jpg" />
        </div>
        <div class="card">
          <span>10</span
          ><img
            src="https://animepostermall.com/wp-content/uploads/2023/08/Retro-Anime-Blue-Lock-Poster-Soccer-Manga-Kraft-Paper-Prints-Sports-Vintage-Home-Room-Bar-Cafe-5.jpg_640x640-5.jpg"
          />
        </div>
      </div>
    </section>
  </body>
</html>
